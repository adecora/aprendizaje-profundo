project:
  type: book
  output-dir: httdocs
  preview:
    port: 4400
    browser: true

lang: es

book:
  title: "MIIA: Aprendizaje Profundo, PEC 1"
  author: "Alejandro de Cora"
  date: today
  output-file: MIIA_Aprendizaje_Profundo_PEC1
  downloads: [pdf]
  chapters:
    - index.md
    - mlp.ipynb
    - references.qmd

bibliography: references.bib
csl: https://www.zotero.org/styles/ieee-access

execute:
  warning: false
  message: false

format:
  html:
    theme:
      light: [pandoc]
      dark: [darkly]
    # other-links:
    #   - text: NASA Open Data
    #     href: https://data.nasa.gov/
    # code-links:
    #   - text: Data Import Code
    #     icon: file-code
    #     href: data-import.py
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: false
    number-sections: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true
    papersize: a4
    geometry:
      - margin=2.5cm
    include-in-header:
      text: |
        \usepackage{graphicx}
        \titlehead{%
          \centering
          \includegraphics[width=0.22\textwidth]{assets/logo-uned.jpg}
        }
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

    # template-partials:
    #   - before-body.tex
